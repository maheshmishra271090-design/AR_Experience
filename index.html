<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>ExpRE</title>


    <!-- FIX 3: Preload above-the-fold background images so browser fetches them
         immediately, not after CSS is parsed. High priority on the hero image. -->
    <link rel="preload" as="image" href="https://raw.githubusercontent.com/Mahesh2710/ARData/main/DynamicData/poster/welcomeposter.png" fetchpriority="high">
    <link rel="preload" as="image" href="https://raw.githubusercontent.com/Mahesh2710/ARData/main/DynamicData/poster/welcome.png">

    <!-- Preconnect / dns-prefetch for all external origins -->
    <link rel="preconnect" href="https://aframe.io" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://akm-img-a-in.tosshub.com" crossorigin>
    <link rel="dns-prefetch" href="https://raw.githubusercontent.com">
    <link rel="dns-prefetch" href="https://cdn.aframe.io">

    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: 'Segoe UI', sans-serif; 
            background-color: #000;
        }
        .a-enter-vr, .a-enter-ar { display: none !important; }

        #welcome-page {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; 
            background-image: url('https://raw.githubusercontent.com/Mahesh2710/ARData/main/DynamicData/poster/welcomeposter.png');
            background-size: cover; background-position: center;
            display: flex; align-items: flex-end;
        }

        #bottom-sheet {
            width: 100%; height: 50%; border-radius: 40px 40px 0 0; position: relative;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 -15px 35px rgba(0,0,0,0.6);
            background-image: url('https://raw.githubusercontent.com/Mahesh2710/ARData/main/DynamicData/poster/welcome.png');
            background-size: 100% 100%; 
            background-repeat: no-repeat;
            background-position: center;
            transform: translateY(100%);
            animation: slideUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        #sheet-content {
            flex: 1; padding: 40px 30px;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.7) 100%);
            display: flex; flex-direction: column; justify-content: center;
        }

        #sheet-footer {
            background: #000; padding: 20px 30px; display: flex;
            justify-content: space-between; align-items: center; border-top: 2px solid #FFF;
        }

        .footer-text h2 { color: white; margin: 0; font-size: 1.2rem; }
        .footer-text p { color: #888; margin: 5px 0 0 0; font-size: 0.9rem; }

        #play-button {
            width: 110px; height: 50px; background: #4185f4; border: none;
            border-radius: 25px; cursor: pointer; display: none;
            justify-content: center; align-items: center; color: white; font-weight: bold;
            box-shadow: 0 4px 15px rgba(65, 133, 244, 0.4);
        }

        #loading-overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); z-index: 150;
            flex-direction: column; justify-content: center; align-items: center; gap: 16px;
        }
        #loading-overlay .spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #4185f4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        #loading-overlay p { color: #fff; font-size: 0.95rem; margin: 0; }

        #scanner-ui {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; pointer-events: none;
        }
        .scanner-frame { width: 75vw; height: 75vw; position: relative; display: flex; justify-content: center; align-items: center; }
        .scanner-img { width: 70%; opacity: 0.6; }
        .scanner-line { position: absolute; width: 100%; height: 4px; background: #a3ff00; top: 0; animation: scan 2s linear infinite; }
        
        #video-container {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; z-index: 40; display: none; 
            flex-direction: column; justify-content: center; align-items: center;
        }
        #video-wrapper { position: relative; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.8); border-radius: 20px; }
        #video-container video { width: 100%; border: 3px solid #FFF; border-radius: 20px; display: block; }

        #close-sticky {
            position: absolute; top: -15px; right: -15px; width: 40px; height: 40px; 
            background: #ff3b30; color: white; border-radius: 50%; border: 2px solid white;
            font-size: 24px; font-weight: bold; cursor: pointer; z-index: 100;
            display: flex; justify-content: center; align-items: center;
        }

        #buy-now-cta {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 280px; height: 70px; display: none; z-index: 60;
            background-size: contain; background-repeat: no-repeat; background-position: center;
        }

        #error-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #1a1a1a; z-index: 200; flex-direction: column; 
            justify-content: center; align-items: center; color: white; text-align: center; padding: 20px;
        }

        /* AR scene container and all A-Frame / MindAR injected elements must fill
           the full viewport. Without this the canvas defaults to 0×0 or a small
           auto size and the camera feed appears cropped or invisible.           */
        #ar-scene-container,
        #ar-scene-container a-scene {
            position: fixed !important;
            top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important;
            z-index: 0;
        }

        /* MindAR injects a <video> for the camera feed — force it fullscreen.
           Target every video inside the container regardless of attributes. */
        #ar-scene-container video {
            position: fixed !important;
            top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important;
            object-fit: cover !important;
            z-index: 0 !important;
        }
        /* Keep the AR canvas on top of the camera video */
        #ar-scene-container canvas {
            position: fixed !important;
            top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important;
            z-index: 1 !important;
            background: transparent !important;
        }
        /* Ensure body/html never show white when AR is active */
        body.ar-active, html.ar-active {
            background-color: transparent !important;
        }

        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        @keyframes slideUp { to { transform: translateY(0); } }
        @keyframes fadeInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div id="welcome-page">
        <div id="bottom-sheet">
            <div id="sheet-content"></div>
            <div id="sheet-footer">
                <div class="footer-text">
                    <h2 id="campaign-title">Checking Campaign...</h2>
                    <p>Experiencing - Reality</p>
                </div>
                <button id="play-button">Play</button>
            </div>
        </div>
    </div>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <p id="loading-msg">Loading AR Experience…</p>
    </div>

    <div id="scanner-ui">
        <div class="scanner-frame">
            <img id="dynamic-scanner-img" src="" class="scanner-img">
            <div class="scanner-line"></div>
        </div>
        <div style="color:white; margin-top:20px; font-weight:bold; text-shadow: 0 2px 4px #000;">SCAN THE PRODUCT</div>
    </div>

    <div id="video-container">
        <div id="video-wrapper">
            <button id="close-sticky">×</button>
        </div>
    </div>

    <div id="error-screen">
        <div style="font-size: 50px;">⚠️</div>
        <h2 id="error-title">Campaign Not Found</h2>
        <p id="error-msg">The link might be expired or incorrect.</p>
        <button onclick="location.reload()" style="margin-top:20px; padding:10px 25px; border-radius:20px; border:none; background:#4185f4; color:white; font-weight:bold;">Try Again</button>
    </div>

    <a href="#" target="_blank" id="buy-now-cta"></a>
    <div id="ar-scene-container"></div>


    <script>
        const API_URL = "https://akm-img-a-in.tosshub.com/app/at-app/at_dev/newicons/AR_expierence.json#?jnsdk";

        // FIX 10: Cache ALL DOM references once at startup — no re-querying inside events
        const playBtn           = document.querySelector('#play-button');
        const welcomePage       = document.querySelector('#welcome-page');
        const scannerUi         = document.querySelector('#scanner-ui');
        const dynamicScannerImg = document.querySelector('#dynamic-scanner-img');
        const videoContainer    = document.querySelector('#video-container');
        const videoWrapper      = document.querySelector('#video-wrapper');
        const buyNowBtn         = document.querySelector('#buy-now-cta');

        // Click tracker fires when CTA is tapped — before navigation opens new tab
        buyNowBtn.addEventListener('click', () => {
            if (campaignData) fireClick(campaignData);
        });
        const campaignTitle     = document.querySelector('#campaign-title');
        const errorScreen       = document.querySelector('#error-screen');
        const loadingOverlay    = document.querySelector('#loading-overlay');
        const loadingMsg        = document.querySelector('#loading-msg');

        let campaignData    = null;
        let isStickyEnabled = true;

        // ── Trackers ──────────────────────────────────────────────────────────────
        // impressionFired guards so the impression pixel fires exactly once
        // even if Play is tapped multiple times or the component re-renders.
        let impressionFired = false;

        function fireImpression(campaign) {
            if (impressionFired) return;
            impressionFired = true;

            // Prefer campaign JSON fields; fall back to hardcoded default
            const src = campaign?.impressionTrackerUrl ||
                'https://imptrack.intoday.in/impression_tracker.php?domain=AT&clientCode=501877&loop=1&';

            // Fire as a 1×1 Image ping — no DOM insertion needed, no CORS issues
            const img = new Image();
            img.src = src + '&t=' + Date.now(); // cache-bust with timestamp
            console.log('[Track] Impression fired:', img.src);
        }

        function fireClick(campaign) {
            // Prefer campaign JSON field; fall back to hardcoded default
            const base = campaign?.clickTrackerUrl ||
                'https://imptrack.intoday.in/click_tracker.php?domain=AT&clientCode=501876&k=';

            // Append the encoded redirect URL if not already in base
            const redirectUrl = campaign?.CTAredirectUrl || '';
            const src = base.includes('k=')
                ? base  // URL already contains the redirect param
                : base + encodeURIComponent(redirectUrl);

            const img = new Image();
            img.src = src + '&t=' + Date.now();
            console.log('[Track] Click fired:', img.src);
        }
        let hasFoundOnce    = false;

        // ── FIX 2: Start API fetch at script parse time — no waiting for 'load' event.
        // window 'load' fires after ALL sub-resources (images, etc.) finish, which can
        // be 1-3 seconds later. DOMContentLoaded or inline is much earlier.
        const campaignPromise = (async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const targetId  = urlParams.get('id');
            const res = await fetch(API_URL);
            if (!res.ok) throw new Error("API Failure");
            const data = await res.json();
            return targetId
                ? data.find(item => item.id === targetId)
                : data.find(item => item.is_active === true);
        })();

        // Background cache hint — uses rel="prefetch" NOT "preload":
        //   preload = high priority, browser warns if unused within ~3s of load event
        //   prefetch = idle-time background download, no usage deadline, no warning
        // aframe-extras is intentionally excluded: this project uses none of its
        // components and it bundles its own Three.js copy which causes:
        //   "WARNING: Multiple instances of Three.js being imported."
        function prefetchARScripts() {
            [
                'https://aframe.io/releases/1.6.0/aframe.min.js',
                'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js'
            ].forEach(src => {
                const link = document.createElement('link');
                link.rel = 'prefetch'; link.as = 'script'; link.href = src;
                document.head.appendChild(link);
            });
        }

        // ── FIX 2: DOMContentLoaded fires as soon as HTML is parsed — no waiting for
        // images. Combined with the inline campaignPromise this is the fastest path.
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const campaign = await campaignPromise;
                if (!campaign) { errorScreen.style.display = 'flex'; return; }

                campaignData = campaign;
                campaignTitle.innerText = 'ExpRE';
                dynamicScannerImg.src   = campaign.scannerImg;
                buyNowBtn.style.backgroundImage = `url('${campaign.CTAimgUrl}')`;
                buyNowBtn.href = campaign.CTAredirectUrl;

                // Start idle-time prefetch of AR scripts (prefetch = no browser warning)
                prefetchARScripts();

                // FIX 12: Cut artificial delay from 600ms → 150ms.
                // Data is ready; only need a short pause for the slide-up animation
                setTimeout(() => {
                    playBtn.style.display   = 'flex';
                    playBtn.style.animation = 'fadeInRight 0.5s ease forwards';
                }, 150);

            } catch (err) {
                console.error("Setup Error:", err);
                errorScreen.style.display = 'flex';
            }
        });

        // ── Script loader ─────────────────────────────────────────────────────────
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
                const s = document.createElement('script');
                s.src = src;
                s.onload = resolve; s.onerror = reject;
                document.head.appendChild(s);
            });
        }

        let arScriptsLoaded = false;

        async function ensureARScripts() {
            if (arScriptsLoaded) return;
            await loadScript('https://aframe.io/releases/1.6.0/aframe.min.js');
            await loadScript('https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js');
            arScriptsLoaded = true;
        }

        // ── Pre-warm camera stream ─────────────────────────────────────────────────
        // Called immediately on Play tap (user gesture context) — starts getUserMedia
        // in parallel with script loading. By the time scripts finish, the camera
        // permission is already granted and the stream is live, so MindAR can use it
        // instantly instead of waiting for its own internal getUserMedia round-trip.
        let warmCameraStream = null;

        async function prewarmCamera() {
            if (warmCameraStream) return warmCameraStream;
            try {
                warmCameraStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode:  { ideal: 'environment' }, // rear camera
                        width:       { ideal: 1280 },
                        height:      { ideal: 720 }
                    },
                    audio: false
                });
                // Show the live feed immediately — inject a raw <video> behind the
                // loading overlay so the user sees the camera while scripts load
                const preview = document.createElement('video');
                preview.id            = 'camera-preview';
                preview.srcObject     = warmCameraStream;
                preview.autoplay      = true;
                preview.muted         = true;
                preview.playsInline   = true;
                preview.style.cssText = [
                    'position:fixed', 'top:0', 'left:0',
                    'width:100%', 'height:100%',
                    'object-fit:cover',
                    'z-index:1',          // behind loading overlay (z-index:150)
                    'background:#000'
                ].join(';');
                document.body.appendChild(preview);
                return warmCameraStream;
            } catch (err) {
                console.warn('[Camera] Pre-warm failed:', err);
                return null;
            }
        }

        // Hand the pre-warmed stream to MindAR so it skips its own getUserMedia.
        // MindAR internally creates a <video> and calls getUserMedia — we intercept
        // by monkey-patching getUserMedia to return our existing stream instantly.
        function injectStreamIntoMindAR(stream) {
            if (!stream) return;
            const original = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
            navigator.mediaDevices.getUserMedia = async (constraints) => {
                // Only intercept video-only requests (MindAR's camera call)
                if (constraints?.video && !constraints?.audio) {
                    navigator.mediaDevices.getUserMedia = original; // restore immediately
                    return stream;
                }
                return original(constraints);
            };
        }

        // ── Build a-scene after AR scripts are ready ──────────────────────────────
        function buildARScene(campaign) {

            // FIX 7: force-front-facing only runs tick() when the target is visible.
            // Previously it called quaternion.set() every frame (~60fps) regardless.
            AFRAME.registerComponent('force-front-facing', {
                init()       { this._active = false; },
                activate()   { this._active = true; },
                deactivate() { this._active = false; },
                tick()       { if (this._active) this.el.object3D.quaternion.set(0, 0, 0, 1); }
            });

            document.querySelector('#ar-scene-container').innerHTML = `
                <a-scene
                    id="ar-scene"
                    embedded
                    mindar-image="autoStart: false; uiScanning: #none; filterMinCF: 0.001; filterBeta: 0.001; missTolerance: 10;"
                    device-orientation-permission-ui="enabled: false"
                    vr-mode-ui="enabled: false"
                    renderer="antialias: true; colorManagement: true;">
                    <a-assets timeout="10000">
                        <video id="myVideo" src="${campaign.videoUrl}" loop="true" crossorigin="anonymous" playsinline webkit-playsinline preload="none"></video>
                    </a-assets>
                    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
                    <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
                        <a-text
                            id="ar-text-ui"
                            value="${campaign.campaignName.toUpperCase()}"
                            align="center" color="#FFFFFF" negate="false"
                            scale="0.8 0.8 0.8" position="0 1.25 0.1"
                            font="https://cdn.aframe.io/fonts/DejaVu-sdf.fnt"
                            force-front-facing>
                        </a-text>
                        <a-video id="ar-video-renderer" src="#myVideo" position="0 0 0.1"></a-video>
                    </a-entity>
                </a-scene>`;

            const sceneEl         = document.querySelector('#ar-scene');
            const arVideoRenderer = document.querySelector('#ar-video-renderer');
            const arTextUI        = document.querySelector('#ar-text-ui');
            const video           = document.querySelector('#myVideo');
            const aAssets         = document.querySelector('a-assets'); // FIX 10: cached

            // VIDEO SIZING — match the AR plane exactly to the target image dimensions
            // ─────────────────────────────────────────────────────────────────────────
            // In MindAR's coordinate space, 1 unit = the physical width of the target
            // image. So a plane of width=1 covers the target exactly side-to-side.
            // Height = 1 / targetAspectRatio  (target width ÷ target height).
            //
            // Strategy (in priority order):
            //   1. Use targetWidth / targetHeight fields from the campaign JSON (fastest)
            //   2. Load the target/scanner image and read its natural dimensions
            //   3. Fall back to the video's own aspect ratio at width=1
            //
            // The video is letterboxed/pillarboxed inside the plane when its aspect
            // ratio differs from the target — the plane itself always matches the image.

            // video.src is set in the a-assets HTML above (prevents a-assets srcless warning)

            function applyPlaneSize(targetW, targetH) {
                const planeW = 1;                      // always exactly the target width
                const planeH = planeW * (targetH / targetW);
                arVideoRenderer.setAttribute('width',  planeW);
                arVideoRenderer.setAttribute('height', planeH);
            }

            function sizeFromTargetImage() {
                return new Promise(resolve => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    // Prefer scannerImg (same image used for the .mind file); fall back to mindUrl
                    img.src = campaign.scannerImg || campaign.targetImageUrl || '';
                    img.onload  = () => resolve({ w: img.naturalWidth,  h: img.naturalHeight });
                    img.onerror = () => resolve(null);
                });
            }

            // Run sizing logic async so it doesn't block scene setup
            (async () => {
                // Option 1: dimensions already in the campaign JSON
                if (campaign.targetImageWidth && campaign.targetImageHeight) {
                    applyPlaneSize(campaign.targetImageWidth, campaign.targetImageHeight);
                    return;
                }

                // Option 2: measure the scanner/target image
                const dims = await sizeFromTargetImage();
                if (dims) {
                    applyPlaneSize(dims.w, dims.h);
                    return;
                }

                // Option 3: fallback — use video aspect ratio at width=1
                // (sets size once video metadata arrives)
                video.addEventListener('loadedmetadata', () => {
                    applyPlaneSize(video.videoWidth, video.videoHeight);
                }, { once: true });
            })();

            sceneEl.setAttribute('mindar-image', {
                imageTargetSrc: campaign.mindUrl,
                autoStart: false, uiScanning: '#none'
            });

            // ── Camera-aware AR startup ───────────────────────────────────────────
            // White screen root causes:
            //   A) arSystem.start() called before camera permission granted
            //   B) canvas transparent but body still white behind it
            //   C) Camera video not yet producing frames when scanner UI appears
            //
            // Fix: two-phase startup
            //   Phase 1 — wait for renderstart (WebGL ready) → call arSystem.start()
            //             This triggers getUserMedia (camera permission prompt)
            //   Phase 2 — watch for MindAR's camera <video> to reach readyState >= 2
            //             (HAVE_CURRENT_DATA) meaning actual pixels are available
            //             THEN hide the loading overlay and show scanner UI
            //
            // Timeout safety nets ensure we never get permanently stuck.

            let arStarted     = false;
            let cameraReady   = false;

            function showScannerUI() {
                if (!cameraReady) return;
                loadingOverlay.style.display = 'none';
                scannerUi.style.display      = 'flex';
            }

            function startARTracking() {
                if (arStarted) return;
                arStarted = true;

                const arSystem = sceneEl.systems['mindar-image-system'];
                if (arSystem) arSystem.start();

                // Phase 2: wait for camera video to have actual frames
                // MindAR injects its camera video into the scene container
                waitForCameraVideo();
            }

            function waitForCameraVideo() {
                // MindAR typically injects the camera video within ~500ms of start()
                // Poll for it, then wait for canplay/readyState
                let camPollAttempts = 0;
                const camPoll = setInterval(() => {
                    // Find any video that isn't our AR content video
                    const camVideo = Array.from(
                        document.querySelectorAll('#ar-scene-container video')
                    ).find(v => v !== document.querySelector('#myVideo'));

                    if (camVideo) {
                        clearInterval(camPoll);

                        if (camVideo.readyState >= 2) {
                            // Already has frames
                            cameraReady = true;
                            showScannerUI();
                        } else {
                            // Wait for first frame
                            camVideo.addEventListener('canplay', () => {
                                cameraReady = true;
                                showScannerUI();
                            }, { once: true });

                            // Safety: if canplay never fires within 4s, show anyway
                            setTimeout(() => {
                                if (!cameraReady) {
                                    cameraReady = true;
                                    showScannerUI();
                                }
                            }, 4000);
                        }
                        return;
                    }

                    // Give up polling after 6s and show scanner regardless
                    if (++camPollAttempts > 30) {
                        clearInterval(camPoll);
                        cameraReady = true;
                        showScannerUI();
                    }
                }, 200);
            }

            // Phase 1: wait for WebGL renderer to be ready
            sceneEl.addEventListener('renderstart', startARTracking, { once: true });

            // Poll fallback in case renderstart already fired (race with innerHTML inject)
            const readyPoll = setInterval(() => {
                if (sceneEl.hasLoaded || sceneEl.renderStarted) {
                    clearInterval(readyPoll);
                    startARTracking();
                }
            }, 200);

            // Hard cap: force start after 5s regardless — but camera check still runs
            setTimeout(() => {
                clearInterval(readyPoll);
                startARTracking();
            }, 5000);

            const targetEntity = document.querySelector('#target-entity');

            targetEntity.addEventListener('targetFound', () => {
                hasFoundOnce    = true;
                isStickyEnabled = true;
                scannerUi.style.display      = 'none';
                videoContainer.style.display = 'none';
                buyNowBtn.style.display      = 'block';

                if (video.parentElement !== aAssets) aAssets.appendChild(video); // FIX 10

                arVideoRenderer.setAttribute('visible', 'true');
                arTextUI.setAttribute('visible', 'true');

                // FIX 7: Enable tick only when target is visible
                arTextUI.components['force-front-facing']?.activate();

                // FIX 6: Trigger metadata load on first scan, not at scene build time
                if (video.readyState === 0) video.load();
                video.play();
            });

            targetEntity.addEventListener('targetLost', () => {
                // FIX 7: Disable tick when target not visible
                arTextUI.components['force-front-facing']?.deactivate();

                if (hasFoundOnce && isStickyEnabled) {
                    arVideoRenderer.setAttribute('visible', 'false');
                    arTextUI.setAttribute('visible', 'false');
                    videoContainer.style.display = 'flex';
                    videoWrapper.appendChild(video);
                    video.play();
                } else {
                    video.pause();
                }
            });

            document.querySelector('#close-sticky').addEventListener('click', (e) => {
                e.stopPropagation();
                isStickyEnabled = false;
                videoContainer.style.display = 'none';
                scannerUi.style.display      = 'flex';
                video.pause();
                aAssets.appendChild(video); // FIX 10: cached ref
            });

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) video.pause();
            });
        }

        // ── Play button ───────────────────────────────────────────────────────────
        playBtn.addEventListener('click', async () => {
            if (!campaignData) return;

            // Fire impression: user has intentionally engaged with the AR experience
            fireImpression(campaignData);

            loadingOverlay.style.display = 'flex';
            loadingMsg.textContent = 'Starting camera…';

            // Kick off camera + scripts IN PARALLEL immediately.
            // prewarmCamera() uses this tap as the user-gesture for getUserMedia.
            // ensureARScripts() downloads A-Frame + MindAR simultaneously.
            // Both run at the same time — total wait = max(camera_time, script_time)
            // instead of camera_time + script_time.
            const [stream] = await Promise.all([
                prewarmCamera(),
                ensureARScripts()
            ]);

            // Inject the live stream into MindAR before the scene builds
            injectStreamIntoMindAR(stream);

            document.body.style.backgroundColor            = 'transparent';
            document.documentElement.style.backgroundColor = 'transparent';
            document.body.classList.add('ar-active');
            document.documentElement.classList.add('ar-active');
            welcomePage.style.display = 'none';

            // Remove the raw preview — MindAR will create its own managed video
            const preview = document.getElementById('camera-preview');
            if (preview) preview.remove();

            try {
                buildARScene(campaignData);
            } catch (err) {
                console.error('AR load error:', err);
                loadingOverlay.style.display = 'none';
                errorScreen.style.display    = 'flex';
            }
        });


    </script>
</body>
</html>
